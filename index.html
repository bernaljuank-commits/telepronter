<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleprompter — Negocios en Florida</title>
<style>
  :root { --bg:#0b0b0c; --fg:#f5f5f2; --muted:#8a8a85; --accent:#f2b134; --bar:#17171a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:10; background:var(--bar); display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; transition:opacity .3s; }
  body.playing #bar { opacity:.3; } body.playing #bar:hover { opacity:1; }
  #bar select, #bar button { background:#26262a; color:var(--fg); border:1px solid #3a3a40; border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; }
  #bar button.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:700; min-width:96px; }
  #bar .val { color:var(--muted); font-size:13px; min-width:44px; text-align:center; }
  #bar .grp { display:flex; align-items:center; gap:4px; }
  #title { flex-basis:100%; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #guide { position:fixed; left:0; right:0; top:38%; height:0; border-top:2px solid rgba(242,177,52,.35); pointer-events:none; z-index:5; }
  #scroller { position:fixed; inset:0; overflow-y:scroll; scrollbar-width:none; }
  #scroller::-webkit-scrollbar { display:none; }
  #text { max-width:1100px; margin:0 auto; padding:45vh 6vw 90vh; font-size:var(--fs,56px); line-height:1.45; font-weight:600; }
  body.mirror #text { transform:scaleX(-1); }
  .label { display:block; font-size:.38em; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:1.6em 0 .4em; font-weight:700; }
  #text p { margin:0 0 .9em; }
  .pause { color:var(--accent); }
  #msg { padding:120px 24px; text-align:center; color:var(--muted); font-size:20px; }
  #bar button.rec { background:#c62828; border-color:#c62828; color:#fff; font-weight:700; }
  #bar button.rec.on { animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.55; } }
  /* Vista previa pequeña de la cámara */
  /* Vista previa: va en una franja propia abajo; el texto se acorta para no quedar tapado */
  :root { --pvw:min(24vw,130px); }
  body.pvbig { --pvw:min(36vw,200px); }
  #preview { position:fixed; left:50%; bottom:10px; transform:translateX(-50%) scaleX(-1); width:var(--pvw); aspect-ratio:9/16; object-fit:cover; border-radius:12px; border:2px solid #3a3a40; background:#000; z-index:20; display:none; cursor:pointer; }
  body.cam #scroller { bottom:calc(var(--pvw) * 16 / 9 + 20px); border-bottom:1px solid #26262a; }
  body.cam #text { padding-bottom:60vh; }
  body.recording #preview { border-color:#e53935; box-shadow:0 0 0 3px rgba(229,57,53,.35); }
  #recTime { position:fixed; left:calc(50% + var(--pvw) / 2 + 10px); bottom:14px; z-index:21; background:#c62828; color:#fff; font:700 13px/1 monospace; padding:5px 8px; border-radius:6px; display:none; }
  body.recording #recTime { display:block; }
  #count { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:30vmin; font-weight:800; color:var(--accent); background:rgba(0,0,0,.55); z-index:30; }
  #saveBox { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:40; background:var(--bar); border:1px solid #3a3a40; border-radius:14px; padding:14px; display:none; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; max-width:94vw; }
  #saveBox button, #saveBox a { background:var(--accent); color:#111; border:0; border-radius:8px; padding:10px 14px; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer; }
  #saveBox .sec { background:#26262a; color:var(--fg); border:1px solid #3a3a40; }
  #mic { position:fixed; z-index:21; display:none; align-items:center; gap:6px; font-size:14px; left:calc(50% - var(--pvw) / 2 - 92px); bottom:14px; background:#17171acc; padding:4px 8px; border-radius:8px; }
  #micBar { width:56px; height:8px; background:#333; border-radius:4px; overflow:hidden; }
  #micLvl { display:block; height:100%; width:0; background:#43a047; transition:width .08s; }
  #mic.off { color:#e53935; } #mic.off #micBar { background:#e53935; }
  /* Celular en horizontal: texto a la izquierda (80%) e imagen a la derecha (20%) */
  @media (orientation: landscape) {
    body.cam #scroller { bottom:0; right:20%; border-bottom:0; border-right:1px solid #26262a; }
    body.cam #text { padding-left:4vw; padding-right:4vw; }
    body.cam #guide { right:20%; }
    #preview, body.pvbig #preview { left:auto; right:1.5vw; top:50%; bottom:auto; transform:translateY(-50%) scaleX(-1); width:17vw; aspect-ratio:auto; max-height:80vh; }
    #recTime { left:auto; right:1.5vw; bottom:auto; top:calc(50% - 4.8vw - 30px); }
    #mic { left:auto; right:1.5vw; bottom:auto; top:calc(50% + 4.8vw + 10px); }
  }
</style>
</head>
<body>
<div id="bar">
  <select id="fecha" aria-label="Fecha del guion"></select>
  <button id="play" class="primary">▶ Iniciar</button>
  <button id="restart" title="Volver al inicio">⏮</button>
  <span class="grp"><button id="slower">−</button><span class="val" id="speedVal"></span><button id="faster">+</button></span>
  <span class="grp"><button id="smaller">A−</button><span class="val" id="fsVal"></span><button id="bigger">A+</button></span>
  <button id="mirror" title="Espejo">⇋ Espejo</button>
  <button id="fs" title="Pantalla completa">⛶</button>
  <button id="cam" title="Encender cámara">🎥 Cámara</button>
  <button id="rec" class="rec" title="Grabar video">⏺ Grabar</button>
  <div id="title"></div>
</div>
<div id="guide"></div>
<video id="preview" muted playsinline autoplay title="Toca para cambiar el tamaño"></video>
<div id="recTime">● 00:00</div>
<div id="mic" title="Nivel del micrófono">🎤<span id="micBar"><span id="micLvl"></span></span></div>
<div id="count"></div>
<div id="saveBox">
  <span id="saveInfo" style="color:var(--muted);font-size:14px"></span>
  <button id="share">Guardar / compartir</button>
  <a id="download" class="sec" download>Descargar</a>
  <button id="discard" class="sec">Cerrar</button>
</div>
<div id="scroller"><div id="text"><div id="msg">Cargando guion…</div></div></div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  let speed = store.get('tp_speed', 40);   // píxeles por segundo
  let fs = store.get('tp_fs', Math.min(window.innerWidth, window.innerHeight) < 600 ? 34 : 56);
  let playing = false, last = 0, acc = 0;
  const sc = $('scroller');

  function applyUI(){
    $('speedVal').textContent = speed + ' px/s';
    $('fsVal').textContent = fs + ' px';
    document.documentElement.style.setProperty('--fs', fs + 'px');
    document.body.classList.toggle('mirror', store.get('tp_mirror', false));
  }
  function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function render(g){
    $('title').textContent = g.fecha + ' — ' + (g.titulo || '');
    document.title = 'Teleprompter — ' + g.fecha;
    $('text').innerHTML = (g.bloques || []).map(b =>
      '<span class="label">' + esc(b.etiqueta || '') + '</span>' +
      String(b.texto || '').split(/\n\s*\n/).map(p =>
        '<p>' + esc(p.trim()).replace(/\.\.\./g, '<span class="pause">...</span>').replace(/\n/g,'<br>') + '</p>').join('')
    ).join('');
    sc.scrollTop = 0;
  }
  async function load(fecha){
    stop();
    try {
      const r = await fetch('guiones/' + fecha + '.json', {cache:'no-store'});
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
      history.replaceState(null, '', '?fecha=' + fecha);
    } catch(e) { $('text').innerHTML = '<div id="msg">No encontré el guion del ' + esc(fecha) + '.</div>'; }
  }
  async function init(){
    applyUI();
    let lista = [];
    try { const r = await fetch('guiones/index.json', {cache:'no-store'}); lista = await r.json(); } catch(e) {}
    lista.sort((a,b) => b.fecha.localeCompare(a.fecha));
    $('fecha').innerHTML = lista.map(g => '<option value="' + g.fecha + '">' + g.fecha + '</option>').join('');
    const q = new URLSearchParams(location.search).get('fecha');
    const f = (q && lista.some(g => g.fecha === q)) ? q : (lista[0] && lista[0].fecha);
    if (!f) { $('text').innerHTML = '<div id="msg">Todavía no hay guiones.</div>'; return; }
    $('fecha').value = f; load(f);
  }
  function tick(t){
    if (!playing) return;
    if (last) { acc += speed * (t - last) / 1000; const px = Math.floor(acc); if (px) { sc.scrollTop += px; acc -= px; } }
    last = t;
    if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2) { stop(); return; }
    requestAnimationFrame(tick);
  }
  function start(){ playing = true; last = 0; acc = 0; document.body.classList.add('playing'); $('play').textContent = '⏸ Pausa'; requestAnimationFrame(tick); }
  function stop(){ playing = false; document.body.classList.remove('playing'); $('play').textContent = '▶ Iniciar'; }
  function setSpeed(d){ speed = Math.max(5, Math.min(300, speed + d)); store.set('tp_speed', speed); applyUI(); }
  function setFs(d){ fs = Math.max(24, Math.min(140, fs + d)); store.set('tp_fs', fs); applyUI(); }

  $('play').onclick = () => playing ? stop() : start();
  $('restart').onclick = () => { stop(); sc.scrollTop = 0; };
  $('faster').onclick = () => setSpeed(5);  $('slower').onclick = () => setSpeed(-5);
  $('bigger').onclick = () => setFs(4);     $('smaller').onclick = () => setFs(-4);
  $('mirror').onclick = () => { store.set('tp_mirror', !store.get('tp_mirror', false)); applyUI(); };
  $('fs').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
  $('fecha').onchange = e => load(e.target.value);
  $('text').addEventListener('click', () => playing ? stop() : start()); // tocar el texto = iniciar/pausar (celular)

  // ---------- Cámara y grabación ----------
  let stream = null, recorder = null, chunks = [], recStart = 0, recTimer = null, lastBlob = null, lastUrl = null;
  const pv = $('preview');
  function pickType(){
    const opts = ['video/mp4','video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return opts.find(t => MediaRecorder.isTypeSupported(t)) || '';
  }
  async function camOn(){
    if (stream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Este navegador no permite usar la cámara. Abre la página en Safari (iPhone) o Chrome (Android).'); return false; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'user', width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30} },
        audio: { echoCancellation:true, noiseSuppression:true }
      });
    } catch(e) {
      // Si falla con audio+video juntos, intento por separado para no perder el sonido
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
        try { const a = await navigator.mediaDevices.getUserMedia({ audio:true }); a.getAudioTracks().forEach(t => stream.addTrack(t)); } catch(e2) {}
      } catch(e3) { alert('No pude abrir la cámara. Revisa que le diste permiso a esta página.\n\n' + e3.message); return false; }
    }
    if (!stream.getAudioTracks().length) {
      try { const a = await navigator.mediaDevices.getUserMedia({ audio:true }); a.getAudioTracks().forEach(t => stream.addTrack(t)); } catch(e) {}
    }
    if (!stream.getAudioTracks().length) alert('Ojo: no tengo acceso al micrófono, el video se grabaría SIN sonido. Dale permiso de micrófono a esta página (en iPhone: Ajustes > Safari > Micrófono > Permitir) y vuelve a encender la cámara.');
    stream.getAudioTracks().forEach(t => t.enabled = true);
    startMeter();
    pv.srcObject = stream; pv.style.display = 'block'; document.body.classList.add('cam');
    $('cam').textContent = '🎥 Apagar';
    return true;
  }
  function camOff(){
    if (recorder && recorder.state === 'recording') return;
    stopMeter();
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; pv.srcObject = null; pv.style.display = 'none'; document.body.classList.remove('cam');
    $('cam').textContent = '🎥 Cámara';
  }
  // Medidor de micrófono: barra verde que se mueve cuando hablas
  let actx = null, meterRAF = null;
  function startMeter(){
    try {
      if (!stream.getAudioTracks().length) { $('mic').classList.add('off'); $('mic').style.display = 'flex'; return; }
      const AC = window.AudioContext || window.webkitAudioContext; actx = new AC();
      const src = actx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
      const an = actx.createAnalyser(); an.fftSize = 512; src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      $('mic').classList.remove('off'); $('mic').style.display = 'flex';
      (function loop(){
        an.getByteTimeDomainData(buf); let m = 0;
        for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128));
        $('micLvl').style.width = Math.min(100, m / 24 * 100) + '%';
        meterRAF = requestAnimationFrame(loop);
      })();
    } catch(e) {}
  }
  function stopMeter(){ cancelAnimationFrame(meterRAF); try { actx && actx.close(); } catch(e) {} actx = null; $('mic').style.display = 'none'; }
  document.addEventListener('touchend', () => { try { actx && actx.state === 'suspended' && actx.resume(); } catch(e) {} });
  function countdown(n){
    return new Promise(res => {
      const c = $('count'); c.style.display = 'flex';
      (function step(i){ if (i === 0) { c.style.display = 'none'; res(); return; } c.textContent = i; setTimeout(() => step(i-1), 1000); })(n);
    });
  }
  function fmt(s){ const m = Math.floor(s/60), r = Math.floor(s%60); return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0'); }
  async function recStartFn(){
    if (!window.MediaRecorder) { alert('Este navegador no permite grabar video. Actualiza Safari/Chrome.'); return; }
    if (!(await camOn())) return;
    $('saveBox').style.display = 'none';
    await countdown(3);
    chunks = [];
    const type = pickType();
    try { recorder = new MediaRecorder(stream, type ? { mimeType:type, videoBitsPerSecond:8000000, audioBitsPerSecond:128000 } : undefined); }
    catch(e) { recorder = new MediaRecorder(stream); }
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRec;
    recorder.start(1000);
    recStart = Date.now();
    document.body.classList.add('recording');
    $('rec').textContent = '⏹ Detener'; $('rec').classList.add('on');
    recTimer = setInterval(() => { $('recTime').textContent = '● ' + fmt((Date.now() - recStart)/1000); }, 500);
    $('recTime').textContent = '● 00:00';
    if (!playing) start();
  }
  function recStopFn(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    stop();
  }
  function finishRec(){
    clearInterval(recTimer);
    document.body.classList.remove('recording');
    $('rec').textContent = '⏺ Grabar'; $('rec').classList.remove('on');
    const type = (recorder && recorder.mimeType) || 'video/mp4';
    lastBlob = new Blob(chunks, { type });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(lastBlob);
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const name = 'negocios-en-florida-' + ($('fecha').value || 'video') + '.' + ext;
    $('download').href = lastUrl; $('download').download = name;
    $('saveInfo').textContent = 'Video listo (' + fmt((Date.now() - recStart)/1000) + ', ' + (lastBlob.size/1048576).toFixed(1) + ' MB)';
    $('saveBox').dataset.name = name;
    $('saveBox').style.display = 'flex';
  }
  $('cam').onclick = () => stream ? camOff() : camOn();
  $('rec').onclick = () => (recorder && recorder.state === 'recording') ? recStopFn() : recStartFn();
  pv.onclick = () => document.body.classList.toggle('pvbig');
  $('share').onclick = async () => {
    if (!lastBlob) return;
    const file = new File([lastBlob], $('saveBox').dataset.name, { type:lastBlob.type });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:'Negocios en Florida' }); } catch(e) {}
    } else { $('download').click(); }
  };
  $('discard').onclick = () => { $('saveBox').style.display = 'none'; };
  window.addEventListener('beforeunload', e => { if (recorder && recorder.state === 'recording') { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : start(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSpeed(5); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setSpeed(-5); }
    else if (e.key === '+' || e.key === '=') setFs(4);
    else if (e.key === '-') setFs(-4);
    else if (e.key === 'Home') { stop(); sc.scrollTop = 0; }
  });
  init();
})();
</script>
</body>
</html>
